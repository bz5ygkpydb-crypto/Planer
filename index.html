<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Planer</title>
  <meta name="theme-color" content="#f3f4fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#090b11" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planer">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Gespeichertes Aussehen sofort anwenden, damit beim Start nichts aufblitzt.
    try {
      var a = localStorage.getItem('planer-accent'), t = localStorage.getItem('planer-theme');
      if (a && /^#[0-9a-f]{6}$/i.test(a)) document.documentElement.style.setProperty('--accent', a);
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"><div class="skeleton"><i></i><i></i><i></i></div></div>
  <div id="bar" hidden></div>
  <div id="fab" hidden></div>
  <div id="scrim"></div>
  <dialog id="sheet"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
